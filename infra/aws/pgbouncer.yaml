# In-cluster PgBouncer (transaction pooling) between pods and RDS.
# Why: N api pods × Prisma pool would exhaust Postgres max_connections as
# the HPA scales; PgBouncer multiplexes thousands of client connections
# onto a small server pool.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  labels: { app: pgbouncer }
spec:
  replicas: 2
  selector:
    matchLabels: { app: pgbouncer }
  template:
    metadata:
      labels: { app: pgbouncer }
    spec:
      containers:
        - name: pgbouncer
          image: bitnami/pgbouncer:1.23.1
          ports:
            - containerPort: 6432
          env:
            - name: POSTGRESQL_HOST
              value: chatrooms-pg.xxxxxx.us-east-1.rds.amazonaws.com # ← RDS endpoint
            - name: POSTGRESQL_PORT
              value: "5432"
            - name: POSTGRESQL_USERNAME
              valueFrom:
                secretKeyRef: { name: chatrooms-db, key: username }
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: chatrooms-db, key: password }
            - name: PGBOUNCER_DATABASE
              value: chatrooms
            - name: PGBOUNCER_POOL_MODE
              value: transaction
            - name: PGBOUNCER_DEFAULT_POOL_SIZE
              value: "20"      # server connections per user+db pair
            - name: PGBOUNCER_MAX_CLIENT_CONN
              value: "2000"    # client side — pods can scale freely
            - name: PGBOUNCER_IGNORE_STARTUP_PARAMETERS
              value: extra_float_digits
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            tcpSocket: { port: 6432 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
spec:
  selector: { app: pgbouncer }
  ports:
    - port: 6432
      targetPort: 6432
