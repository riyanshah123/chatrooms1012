# Non-secret configuration. Endpoint hosts point at managed services
# (RDS via PgBouncer, ElastiCache, OpenSearch) — overridden per overlay.
apiVersion: v1
kind: ConfigMap
metadata:
  name: chatrooms-config
data:
  NODE_ENV: "production"
  API_PORT: "4000"
  WEB_URL: "https://chatrooms101.com"
  GOOGLE_CALLBACK_URL: "https://chatrooms101.com/api/v1/auth/google/callback"
  REDIS_URL: "redis://chatrooms-redis.internal:6379"
  OPENSEARCH_URL: "https://chatrooms-search.internal:9200"
  S3_REGION: "us-east-1"
  S3_BUCKET: "chatrooms-media"
  JWT_ACCESS_TTL: "15m"
  JWT_REFRESH_TTL: "30d"
  RATE_LIMIT_POINTS: "100"
  RATE_LIMIT_WINDOW: "60"
