apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chatrooms-staging
resources:
  - ../../base

patches:
  # Small footprint: single replicas, no surge capacity needed
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/strategy/rollingUpdate/maxUnavailable
        value: 1
    target: { kind: Deployment, name: api }
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target: { kind: Deployment, name: web }
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
    target: { kind: HorizontalPodAutoscaler, name: api }
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
    target: { kind: HorizontalPodAutoscaler, name: web }
  # PDBs would block node drains with 1 replica — relax them
  - patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
    target: { kind: PodDisruptionBudget, name: api }
  - patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
    target: { kind: PodDisruptionBudget, name: web }
  - patch: |-
      - op: replace
        path: /data/WEB_URL
        value: https://staging.chatrooms101.com
      - op: replace
        path: /data/GOOGLE_CALLBACK_URL
        value: https://staging.chatrooms101.com/api/v1/auth/google/callback
    target: { kind: ConfigMap, name: chatrooms-config }

images:
  - name: chatrooms/api
    newName: ghcr.io/chatrooms101/api
  - name: chatrooms/web
    newName: ghcr.io/chatrooms101/web
  - name: chatrooms/migrate
    newName: ghcr.io/chatrooms101/migrate
