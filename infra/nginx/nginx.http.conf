# HTTP-only variant of nginx.conf for docker-compose.prod.yml (staging/demo
# boxes where TLS terminates upstream or isn't set up yet). Same routing and
# rate-limit policy as the TLS config — see nginx.conf for the annotated
# production version.

worker_processes auto;
events { worker_connections 8192; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    limit_req_zone $binary_remote_addr zone=general:20m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=3r/s;
    limit_req_status 429;

    upstream web_upstream { server web:3000; keepalive 32; }
    upstream api_upstream { ip_hash; server api:4000; keepalive 32; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;
        client_max_body_size 5m;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /socket.io/ {
            limit_req zone=general burst=40 nodelay;
            proxy_pass http://api_upstream;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
            proxy_buffering off;
        }

        location /api/v1/auth/ {
            limit_req zone=auth burst=6 nodelay;
            proxy_pass http://api_upstream;
        }

        location /api/ {
            limit_req zone=general burst=60 nodelay;
            proxy_pass http://api_upstream;
        }

        location /_next/static/ {
            proxy_pass http://web_upstream;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            limit_req zone=general burst=60 nodelay;
            proxy_pass http://web_upstream;
        }
    }
}
