# ─────────────────────────────────────────────────────────────────────────────
# Chatrooms101 — Nginx edge configuration
#
# Roles: TLS termination · reverse proxy (web + api) · outermost rate
# limiting · WebSocket upgrade · compression · static asset caching.
# In Kubernetes this file's behavior is reproduced by ingress-nginx
# annotations (see infra/k8s); this standalone config serves VM/compose
# deployments and documents the intended edge policy in one place.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 8192; # WS connections are long-lived — size generously
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ── Logging (JSON — machine-parseable for the log pipeline) ──────────
    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri",'
        '"status":$status,"bytes":$body_bytes_sent,'
        '"rt":$request_time,"upstream_rt":"$upstream_response_time",'
        '"ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;            # don't advertise the nginx version

    # ── Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain
               image/svg+xml application/xml;

    # ── Rate-limit zones (outermost layer; API adds per-user limits) ─────
    #  general: 20 r/s per IP with burst — normal browsing never notices
    #  auth:    strict — login/signup brute-force protection at the edge
    limit_req_zone $binary_remote_addr zone=general:20m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=3r/s;
    limit_conn_zone $binary_remote_addr zone=perip:20m;
    limit_req_status 429;
    limit_conn_status 429;

    # ── Upstreams ────────────────────────────────────────────────────────
    upstream web_upstream {
        least_conn;
        server web:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ip_hash = sticky sessions, required ONLY for Socket.IO's HTTP
    # long-polling fallback (the multi-request handshake must hit the same
    # pod). Pure-WebSocket clients don't need it but aren't harmed.
    upstream api_upstream {
        ip_hash;
        server api:4000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # WS upgrade helper: "upgrade" when the client asks, close otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # ── HTTP → HTTPS ─────────────────────────────────────────────────────
    server {
        listen 80;
        server_name chatrooms101.com www.chatrooms101.com;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # ── Main vhost ───────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name chatrooms101.com www.chatrooms101.com;

        ssl_certificate     /etc/letsencrypt/live/chatrooms101.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chatrooms101.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        client_max_body_size 5m;      # avatar uploads go via presigned S3, so keep this small
        limit_conn perip 60;

        # Common proxy headers
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Socket.IO (WebSocket + polling fallback) ─────────────────────
        location /socket.io/ {
            limit_req zone=general burst=40 nodelay;
            proxy_pass http://api_upstream;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout  75s;   # > Socket.IO pingInterval+pingTimeout
            proxy_send_timeout  75s;
            proxy_buffering off;
        }

        # ── Auth endpoints: strict brute-force limits at the edge ────────
        location /api/v1/auth/ {
            limit_req zone=auth burst=6 nodelay;
            proxy_pass http://api_upstream;
        }

        # ── REST API ─────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=general burst=60 nodelay;
            proxy_pass http://api_upstream;
        }

        # ── Next.js static assets: immutable, cache at the edge & CDN ────
        location /_next/static/ {
            proxy_pass http://web_upstream;
            proxy_cache_valid 200 7d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ── Everything else → Next.js SSR ────────────────────────────────
        location / {
            limit_req zone=general burst=60 nodelay;
            proxy_pass http://web_upstream;
        }
    }
}
